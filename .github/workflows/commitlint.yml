name: Commit convention

# Lints the PR title against Conventional Commits — `type(scope): subject`, with an optional
# scope (up to three) from the OpenLogo taxonomy. The PR title is BLOCKING because it becomes the
# squash-merge subject; individual commit subjects are ADVISORY (squash discards them, and a cloud
# agent cannot rewrite the bootstrap commits created before its first turn) and surface as warning
# annotations. See .github/scripts/validate-commits.py and
# .github/skills/devops/branching-and-commits/SKILL.md. Owned by @devops.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Self-test the commit checker
        run: python .github/scripts/test-validate-commits.py
      - name: Lint PR title (blocking) and commit subjects (advisory)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/validate-commits.py
