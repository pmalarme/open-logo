name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with the gh-aw MCP server.
# Generated by `gh aw init`, then adapted to this repository.
#
# Install method: `.github/aw/install.sh` — a platform-aware, checksum-verified download of the
# prebuilt release binary pinned in `.github/aw/version` (the single authoritative pin).
# A direct release download is the only approach that works in a restricted-network agent
# sandbox (`gh extension install` and `go install` are both blocked; the release CDN is not).
# The script is shared verbatim with contributors — see AGENTS.md §"gh-aw bootstrap" — so the
# bootstrap procedure exists in exactly one place.
#
# Deviations from the `gh aw init` output, and why:
#   1. The generated `github/gh-aw-actions/setup-cli@<version>` step (which hardcoded the version
#      twice) is replaced by the shared install script, keeping the pin single-source and the
#      restricted-sandbox path identical to the documented one.
#   2. `actions/checkout` is @v7 rather than the generated @v6, matching every other workflow in
#      this repository (see the "Conventions" section of
#      .github/instructions/workflows.instructions.md, which pins actions by major tag).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/aw/**

# Least privilege: nothing here needs more than read access to the repository.
permissions:
  contents: read

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install gh-aw (pinned, checksum-verified, restricted-network-safe)
        # Upgrade: edit .github/aw/version (one line) and recompile lock files.
        env:
          GH_AW_INSTALL_DIR: ${{ runner.temp }}/gh-aw-bin
        run: |
          sh .github/aw/install.sh
          echo "$GH_AW_INSTALL_DIR" >> "$GITHUB_PATH"
          "$GH_AW_INSTALL_DIR/gh-aw" --version
