name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server.
# Generated by `gh aw init` and updated to read the pinned version from .github/aw/version
# (the single authoritative pin) so that upgrading is a one-line change there plus a recompile.
#
# Install method: direct prebuilt-binary download from the GitHub releases page.
# This is the only approach that works in a restricted-network agent sandbox (gh extension
# install and go install are both blocked; release-assets.githubusercontent.com is not).
# See AGENTS.md §"gh-aw bootstrap" for the full bootstrap procedure.
#
# Deviation from `gh aw init` output: (1) install step replaced with a curl download that reads
# the version from .github/aw/version to keep the pin single-source; (2) actions/checkout
# updated from the generated @v6 to @v7 to match the repo-wide convention (see ci.yml).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install gh-aw (pinned, restricted-network-safe)
        # Reads the pinned version from .github/aw/version — the single authoritative place.
        # Upgrade: edit .github/aw/version (one line) and recompile lock files.
        run: |
          GH_AW_VERSION="$(cat .github/aw/version)"
          curl -fsSL \
            "https://github.com/github/gh-aw/releases/download/${GH_AW_VERSION}/linux-amd64" \
            -o /usr/local/bin/gh-aw
          chmod +x /usr/local/bin/gh-aw
          gh-aw --version
