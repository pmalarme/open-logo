name: CI

# Encodes the team Definition of Done as gates. The meta job runs from day one and
# detects whether the workspace manifest (package.json) has landed; code jobs activate
# automatically once it has. See .github/skills/devops/ci-pipeline/SKILL.md. Owned by @devops.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta:
    name: Meta (labels, issue forms, workflows)
    runs-on: ubuntu-latest
    # dorny/paths-filter (the `filter` step below) reads the changed-file list from the pull
    # request via the REST API, which needs `pull-requests: read` on top of the workflow-wide
    # `contents: read`; without it the step 403s on PRs and this job — and everything gated on
    # its outputs — fails before running. Scoped to this job rather than raised workflow-wide so
    # every other job keeps the least-privilege default.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_toolchain: ${{ steps.detect.outputs.has_toolchain }}
      studio_changed: ${{ steps.filter.outputs.studio }}
      workflows_changed: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Validate metadata
        run: python .github/scripts/validate-meta.py
      - name: Self-test the frontmatter check
        run: python .github/scripts/test-validate-meta.py
      - name: Guard package-lock.json against non-public registries
        # Regression guard for issue #642 / ADR-0017: every "resolved" entry must come from the
        # public npm registry, never a private/internal mirror (e.g. an Azure DevOps feed) that
        # outside contributors and CI cannot reach. Runs from day one — no toolchain needed.
        run: python .github/scripts/validate-lockfile-registry.py
      - name: Self-test the lockfile registry guard
        run: python .github/scripts/test-validate-lockfile-registry.py
      - name: Guard gh-aw workflow source/lock-file pairing
        # Issue #597: an orphaned .lock.yml with no .md source (or vice versa) is caught here,
        # before gh-aw compile ever runs — see the workflows-compile job for content drift. Only
        # a .md gh-aw actually compiles (first line is a frontmatter opener AND the frontmatter,
        # parsed as YAML, declares a top-level `on:` trigger — verified empirically against gh-aw
        # v0.83.1) is required to have a paired lock file; a plain doc (e.g. README.md), a
        # trigger-less import fragment, or anything under a subdirectory is lock-free. See
        # validate-workflow-lockfiles.py's module docstring and requires_lock().
        # Runs from day one: passes cleanly while zero agentic workflows exist (today's state).
        run: python .github/scripts/validate-workflow-lockfiles.py
      - name: Self-test the workflow lock-file pairing guard
        run: python .github/scripts/test-validate-workflow-lockfiles.py
      - id: detect
        name: Detect toolchain
        # hashFiles() is unreliable in a job-level `if` (it runs before checkout), so we
        # detect the manifest here and expose it as an output the code jobs gate on.
        run: |
          if [ -f package.json ]; then
            echo "has_toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_toolchain=false" >> "$GITHUB_OUTPUT"
          fi
      - id: filter
        name: Detect studio-affecting and workflows-affecting changes
        # Path-scopes the (heavy, browser-based) studio visual-regression job so it only runs when
        # the studio or a package it composes actually changes. Output consumed by `studio-visual`.
        # Also scopes the gh-aw compile-drift job (needs network access to fetch the pinned
        # release asset) to PRs that actually touch workflow sources/locks or the pin/installer.
        uses: dorny/paths-filter@v3
        with:
          filters: |
            studio:
              - 'packages/studio/**'
              - 'packages/core/**'
              - 'packages/parser/**'
              - 'packages/runtime/**'
              - 'packages/turtle/**'
              - 'packages/edu/**'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/aw/**'
              - '.github/scripts/validate-workflow-lockfiles.py'
              - '.github/scripts/test-validate-workflow-lockfiles.py'

  workflows-compile:
    name: Agentic workflow compile is clean (gh-aw)
    # Issue #597: what runs in Actions must be exactly what `gh-aw compile` produces from the
    # reviewed .md source, never a hand-edited or stale .lock.yml. Path-scoped (via `meta`'s
    # `filter` step) so this only runs on the PRs — and pushes to `main` — that actually touch
    # workflow sources/locks, the gh-aw pin, its installer, or the pairing-guard scripts; it is
    # cheap, but the pinned-binary download still needs network access to the release CDN, so it
    # does not run on every unrelated change.
    needs: meta
    if: ${{ needs.meta.outputs.workflows_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deliberately no Python here: the source/lock-file pairing guard (which needs pyyaml, and
      # therefore a PyPI download) runs once, in the `meta` job this job already `needs`, so an
      # orphan in either direction is caught before this job starts — and this job keeps its
      # promise of no network beyond the pinned gh-aw release asset. Pairing catches what
      # `gh-aw compile` cannot see (it never deletes a lock whose source is gone, and has nothing
      # to compile for a source that was never compiled); this job catches content drift.
      - name: Install gh-aw (pinned, checksum-verified — see .github/aw/install.sh)
        env:
          GH_AW_INSTALL_DIR: ${{ runner.temp }}/gh-aw-bin
        run: |
          sh .github/aw/install.sh
          echo "$GH_AW_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Compile and fail on drift from the committed .lock.yml files
        # No secret and no agentic execution here: `gh-aw compile` only turns markdown into
        # YAML, it never runs a workflow. `git add -A` (not `git diff --exit-code` alone) is
        # required to also catch a .md source whose .lock.yml was never committed at all: an
        # untracked new file is invisible to a plain `git diff`, but a real gap in what CI runs.
        #
        # The early-exit guard below mirrors gh-aw's own definition of "nothing to compile",
        # verified empirically against gh-aw v0.83.1: it exits 1 with "no workflow markdown
        # files found ... (workflow files must start with a frontmatter opener on the first
        # line)" whenever .github/workflows/ contains *some* .md file(s) but none with a
        # frontmatter opener as the first line (e.g. only a README.md). A bare
        # `ls .github/workflows/*.md` check would miss that case and let `gh-aw compile` run
        # into that exit-1 spuriously, so this checks for a frontmatter opener specifically, not
        # merely "some .md file exists". `tr -d '\r'` strips a trailing CR so a CRLF-encoded .md
        # (which gh-aw compiles just fine, and which validate-workflow-lockfiles.py's
        # requires_lock() already handles correctly via splitlines()) is not missed here just
        # because `head -n 1` alone would otherwise compare `---\r` against `---` and never match.
        run: |
          has_frontmatter=false
          for f in .github/workflows/*.md; do
            [ -e "${f}" ] || continue
            # gh-aw excludes README.md by name, case-insensitively, before frontmatter detection
            # (pkg/cli/workflows.go, v0.83.1) — so must this probe, or a README with frontmatter
            # would make it call `gh-aw compile` on a directory gh-aw considers empty.
            case "$(basename "${f}" | tr '[:upper:]' '[:lower:]')" in
              readme.md) continue ;;
            esac
            first_line="$(head -n 1 "${f}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            if [ "${first_line}" = "---" ]; then
              has_frontmatter=true
              break
            fi
          done
          if [ "${has_frontmatter}" = false ]; then
            echo "No agentic-workflow sources with a frontmatter opener (.github/workflows/*.md starting with '---') — nothing to compile."
            exit 0
          fi
          gh-aw compile
          git add -A -- .github/workflows/
          drifted="$(git diff --cached --name-only -- .github/workflows/)"
          if [ -n "${drifted}" ]; then
            echo "::error::gh-aw compile changed the following committed file(s) — the .lock.yml is out of sync with its .md source:"
            echo "${drifted}" | sed 's/^/::error::  - /'
            echo "::error::Fix: sh .github/aw/install.sh && gh-aw compile && git add .github/workflows/*.lock.yml && git commit"
            exit 1
          fi
          echo "gh-aw compile: every .lock.yml matches its .md source."

  build:
    name: Build & type-check
    needs: meta
    if: ${{ needs.meta.outputs.has_toolchain == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      # Install from the committed lockfile (npm workspaces — see ADR-0001).
      # No --if-present: every DoD script exists now that the toolchain has landed, so a
      # missing gate is a real failure rather than a silent pass.
      - run: npm ci
      - run: npm run -s build
      - run: npm run -s typecheck

  lint:
    name: Lint & format
    needs: meta
    if: ${{ needs.meta.outputs.has_toolchain == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run -s lint
      - run: npm run -s format:check

  test:
    name: Unit, conformance & examples
    needs: meta
    if: ${{ needs.meta.outputs.has_toolchain == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run -s test
      - run: npm run -s conformance
      - run: npm run -s examples
      # TODO(@devops + @testing): add integration and a11y/pedagogy gates as those
      # suites land (DoD sections 5-9); wire them here so they block merge.

  coverage:
    name: Test coverage (100%)
    needs: meta
    if: ${{ needs.meta.outputs.has_toolchain == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run -s coverage

  studio-visual:
    name: Studio visual regression
    needs: meta
    # Path-scoped: only runs when the studio (or a package it composes) changes — see the `filter`
    # step in `meta`. Runs in the Playwright-maintained container so the headless Chromium + system
    # fonts exactly match the image the committed `-linux.png` baselines were generated in
    # (packages/studio/playwright.config.ts documents the matching `docker run` command). Kept out
    # of the `node:test` coverage gate: these are `e2e/*.spec.ts` files, not `*.test.mjs`.
    if: ${{ needs.meta.outputs.has_toolchain == 'true' && needs.meta.outputs.studio_changed == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # `test:visual` builds the studio web bundle and serves it via `vite preview`, then renders it
      # at the narrow + wide viewports. CI is set, so Playwright fails on a missing baseline instead
      # of silently creating one, and never reuses an external server.
      - name: Run studio visual-regression tests
        run: npm run -s test:visual --workspace @openlogo/studio
      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-visual-playwright-report
          path: packages/studio/playwright-report/
          retention-days: 7
