name: "Epic"
description: A large capability, usually one spec profile or major feature, spanning multiple slices and agents.
title: "[epic]: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        An **epic** is a capability under a **saga** (**saga → epic → issue**). It closes — via the
        **Epic Gate** capability audit — when its profile is conformant across all domains. Attach the
        epic to its parent saga, and its child issues to the epic, as **native GitHub sub-issues**
        (not a body checklist). An epic has **no branch** of its own.
  - type: dropdown
    id: profile
    attributes:
      label: Profile / area
      options:
        - core
        - turtle-rendering
        - data
        - geometry
        - heritage
        - sprites
        - interaction
        - sound
        - modules
        - localization
        - educational
        - tutor-ai
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec sections (normative)
      placeholder: spec/rendering.md, spec/conformance.md#turtle--rendering
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What capability this epic delivers and why it matters.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Epic Gate — exit criteria
      value: |
        - [ ] All child issues closed (each passed the Issue Gate)
        - [ ] No blocker bugs open; required `[spec]` decisions approved
        - [ ] The capability's conformance suite is green across all domains
        - [ ] Cross-cutting contracts (AST / events / diagnostics / token classes) stable
        - [ ] Docs + highlighting + examples updated; no unresolved architecture questions
        - [ ] Specialist review + rubber-duck review recorded at capability level
    validations:
      required: true
